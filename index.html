<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#bb005c">
  <title>Thangavelu Engineering College · Gate System</title>
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --brand:#bb005c; --brand-dark:#7d0040; --plum:#2d0a1d; --blush:#fbf1f6; --line:#ecd5e1; --muted:#7a6571; --ease:cubic-bezier(.22,1,.36,1); }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; font-family:'Nunito Sans',Arial,sans-serif; color:#26121c;
      background: radial-gradient(900px 420px at 50% -120px,#f6d3e4,transparent 70%), var(--blush); padding:0 14px 60px; }
    .wrap { max-width:520px; margin:0 auto; text-align:center; padding-top:40px; }
    .logo { width:120px; height:120px; border-radius:50%; background:#fff; box-shadow:0 10px 30px rgba(187,0,92,.25);
      animation: logoIn 1s var(--ease) both; }
    h1 { font-family:'Cormorant Garamond',Georgia,serif; font-size:clamp(26px,7vw,38px); line-height:1.1; margin:18px 0 6px;
      color:var(--brand-dark); letter-spacing:.04em; animation: fadeUp .8s .2s var(--ease) both; }
    .sub { color:var(--muted); letter-spacing:.12em; font-weight:600; font-size:14px; animation: fadeUp .8s .35s var(--ease) both; }
    .cards { display:grid; gap:14px; margin-top:34px; }
    a.card { display:block; text-align:left; text-decoration:none; color:inherit; background:#fff; border:1px solid var(--line);
      border-top:4px solid var(--brand); border-radius:14px; padding:20px 22px; box-shadow:0 14px 40px rgba(125,0,64,.10);
      transition: transform .3s var(--ease), box-shadow .3s; animation: fadeUp .8s var(--ease) both; }
    a.card:nth-child(1) { animation-delay:.5s; } a.card:nth-child(2) { animation-delay:.65s; }
    a.card:hover { transform: translateY(-4px); box-shadow:0 18px 44px rgba(125,0,64,.18); }
    a.card b { display:block; font-size:19px; color:var(--plum); }
    a.card span { color:var(--muted); font-size:14px; line-height:1.5; }
    .watermark { position:fixed; right:14px; bottom:10px; font-family:'Cormorant Garamond',Georgia,serif; font-weight:700;
      font-size:13px; letter-spacing:.22em; color:var(--brand-dark); opacity:.5; pointer-events:none; user-select:none; }
    @keyframes logoIn { from{opacity:0;transform:scale(.6) rotate(-18deg)} to{opacity:1;transform:none} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="icon-512.png" alt="Thangavelu Engineering College logo">
    <h1>Thangavelu Engineering College</h1>
    <div class="sub">FAITH · PEACE · WISDOM</div>
    <div class="cards">
      <a class="card" href="scan"><b>Phone scanner</b><span>Scan student ID barcodes with the phone camera.</span></a>
      <a class="card" href="desk"><b>Security desk</b><span>USB barcode scanner, daily and monthly reports.</span></a>
    </div>
  </div>
  <div class="watermark" aria-hidden="true">THIVARA SOLUTIONS</div>
</body>
</html>
